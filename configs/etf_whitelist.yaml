# 行业 → ETF 语义候选池（映射第一步）
#
# 冻结规则：只依据 ETF 名称 / 跟踪指数名称的经济含义制定，冻结于开发期末（2022-12-31）。
# 测试期内不得根据回测结果修改；如需修改，必须升级 version 并在论文中说明。
#
# 匹配文本 = "ETF 名称 + 跟踪指数名称"。一只 ETF 满足以下条件即进入某行业的候选池：
#   (命中 keywords 任一 或 跟踪指数名称 ∈ include_index_names) 且 未命中 exclude_keywords / global_exclude
# 候选池之后还要经过流动性过滤与 120 日相关性检验（见 configs/base.yaml 的 mapping 段）。

version: "v1"
frozen_at: "2022-12-31"

# 宽基 / 策略 / 区域 / 所有制类主题，与单一行业的经济含义不符
global_exclude:
  - ESG
  - 央企
  - 国企
  - 国资
  - 民企
  - 治理
  - 社会责任
  - 大湾区
  - 粤港澳
  - 长三角
  - 成渝
  - 湖北
  - 浙江
  - 杭州湾
  - G60
  - 战略新兴
  - 研发创新
  - 核心竞争力
  - 专精特新
  - 央视财经
  - 科技龙头
  - 科技50
  - 科技100
  - 科技先锋
  - 科技引领
  - 科技创新
  - 创新100
  - 小康
  - 民族品牌
  - 科技传媒通信
  - 电子信息传媒

industries:
  农林牧渔:
    keywords: [农业, 农牧, 畜牧, 养殖, 粮食, 种业]
  基础化工:
    keywords: [化工, 新材料]
    include_index_names: [中证全指原材料指数]
  钢铁:
    keywords: [钢铁]
    include_index_names: [中证全指原材料指数, 上证大宗商品股票指数]
  有色金属:
    keywords: [有色, 稀土, 稀有金属, 黄金产业, 矿业]
    include_index_names: [中证全指原材料指数, 上证大宗商品股票指数]
  电子:
    keywords: [电子, 半导体, 芯片, 集成电路]
  家用电器:
    keywords: [家电, 家用电器]
  食品饮料:
    keywords: [食品, 饮料, 酒, 主要消费]
  纺织服饰:
    keywords: [纺织, 服装, 服饰]
  轻工制造:
    keywords: [轻工, 家居, 造纸, 包装]
  医药生物:
    keywords: [医药, 医疗, 生物, 创新药, 中药, 疫苗, 制药, 公共卫生]
  公用事业:
    keywords: [公用事业, 电力, 燃气, 水务]
    exclude_keywords: [设备]
  交通运输:
    keywords: [交通运输, 运输, 物流, 航运, 港口]
  房地产:
    keywords: [房地产, 地产]
    exclude_keywords: [金融地产]
  商贸零售:
    keywords: [商贸, 零售, 批发]
  社会服务:
    keywords: [旅游, 酒店, 餐饮, 教育, 消费服务]
  建筑材料:
    keywords: [建筑材料, 建材, 水泥]
  建筑装饰:
    keywords: [建筑装饰, 基建, 工程建设]
  电力设备:
    keywords: [光伏, 电池, 新能源, 储能, 风电, 电网设备, 碳中和, 低碳, 绿色能源]
    exclude_keywords: [新能源汽车, 智能汽车, 电动汽车]
  国防军工:
    keywords: [军工, 国防, 航空航天, 航天航空, 卫星产业, 通用航空, 船舶]
  计算机:
    keywords: [计算机, 软件, 云计算, 大数据, 人工智能, 信息安全, 信息技术, 信创, 数字经济, 金融科技, 工业互联网]
    exclude_keywords: [科创板新一代信息技术]
  传媒:
    keywords: [传媒, 游戏, 动漫, 影视, 文娱, 文化]
  通信:
    keywords: [通信, 5G, 电信, 物联网]
  银行:
    keywords: [银行]
    include_index_names: [上证180金融股指数, 中证金融地产指数, 中证全指金融地产指数, 沪深300金融地产指数, 上证金融地产行业指数]
  非银金融:
    keywords: [证券, 券商, 保险, 非银行金融]
    include_index_names: [中证金融地产指数, 中证全指金融地产指数, 沪深300金融地产指数, 上证金融地产行业指数]
  汽车:
    keywords: [汽车, 新能源车, 车联网]
    exclude_keywords: [电池]
  机械设备:
    keywords: [机械, 机床, 机器人, 高端装备, 装备产业, 智能制造, 工业母机]
  煤炭:
    keywords: [煤炭]
    include_index_names: [中证能源指数, 中证全指能源指数, 上证大宗商品股票指数, 上证自然资源指数]
  石油石化:
    keywords: [石油, 石化, 油气]
    include_index_names: [中证能源指数, 中证全指能源指数, 上证大宗商品股票指数, 上证自然资源指数]
  环保:
    keywords: [环保, 碳中和]
  美容护理:
    keywords: [美容, 化妆品, 医美]
